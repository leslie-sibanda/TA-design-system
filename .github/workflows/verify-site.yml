name: Verify static site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site (${{ matrix.base_path || 'root' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base_path: ['', '/ta-design-system']
    env:
      # Deployment-only: Pages serves this project at /ta-design-system; local commands default to root.
      SITE_BASE_PATH: ${{ matrix.base_path }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (peeled tag)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload verified Pages export
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.base_path == '/ta-design-system'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
